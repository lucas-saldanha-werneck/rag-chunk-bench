[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-chunk-bench"
version = "0.1.0"
description = "Compare chunking strategies for RAG on a small question set, offline, no dependencies"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rag-chunk-bench = "chunkbench.cli:main"

[tool.setuptools]
packages = ["chunkbench"]

[dependency-groups]
dev = ["pytest>=8"]
